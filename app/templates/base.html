<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI Running Coach</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://unpkg.com/htmx.org@1.9.12"></script>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body class="bg-body-tertiary">
  <nav class="navbar navbar-dark bg-dark mb-4">
    <div class="container">
      <span class="navbar-brand mb-0 h1">🏃 AI Running Coach</span>
      <span class="navbar-text">
        {% if settings.garmin_enabled %}
          <span class="badge text-bg-success">Garmin</span>
        {% else %}
          <span class="badge text-bg-secondary">Demo data</span>
        {% endif %}
        {% if settings.ai_enabled %}
          <span class="badge text-bg-info">Claude AI</span>
        {% else %}
          <span class="badge text-bg-warning">Coach offline</span>
        {% endif %}
      </span>
    </div>
  </nav>
  <main class="container pb-5">
    {% block content %}{% endblock %}
  </main>
  <footer class="container text-center text-muted small py-4">
    AI Running Coach v{{ version }} · infrastruttura gratuita · SQLite + FastAPI
  </footer>
</body>
</html>
