[project]
name = "ai-running-coach"
version = "0.2.0"
description = "AI-powered personal running coach: ingest Garmin runs, analyse training load, and generate coaching with Claude."
requires-python = ">=3.11"
readme = "README.md"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
# Put the repo root on sys.path so the app package imports under a bare `pytest`
# invocation (CI), not only under `python -m pytest` which adds the cwd itself.
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["B008"]  # FastAPI uses function calls in argument defaults (Depends)

[tool.coverage.run]
source = ["app"]
omit = ["app/collection/garmin_client.py"]
