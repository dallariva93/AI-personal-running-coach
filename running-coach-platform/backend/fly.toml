# Fly.io deployment — recommended free option for durable SQLite.
# A persistent volume keeps the database across restarts/redeploys.
#
#   fly launch --no-deploy        # creates the app (edit name below)
#   fly volume create coach_data --size 1   # 1 GB free volume
#   fly secrets set ANTHROPIC_API_KEY=... GARMIN_EMAIL=... GARMIN_PASSWORD=... API_TOKEN=...
#   fly deploy

app = "ai-running-coach"
primary_region = "cdg"

[build]
  dockerfile = "Dockerfile"

[env]
  APP_ENV = "production"
  LOG_JSON = "true"
  DATABASE_URL = "sqlite:///data/running_coach.db"
  DB_PATH = "/app/data/running_coach.db"
  PORT = "8000"

[[mounts]]
  source = "coach_data"
  destination = "/app/data"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    method = "get"
    path = "/api/health"
    interval = "30s"
    timeout = "5s"
    grace_period = "15s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
