# Render.com blueprint (free web service).
#
# NOTE: Render's free tier does NOT include a persistent disk, so the SQLite
# database lives on an ephemeral filesystem and is lost on each redeploy/sleep.
# For durable data on Render, EITHER attach a paid disk, OR enable the
# Litestream backup to Cloudflare R2 (see docs/DEPLOYMENT.md) by setting the
# LITESTREAM_REPLICA_URL secret and building with deploy/litestream/Dockerfile.
#
# For free + durable with zero extra setup, prefer Fly.io (see fly.toml).

services:
  - type: web
    name: ai-running-coach
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: APP_ENV
        value: production
      - key: LOG_JSON
        value: "true"
      - key: DATABASE_URL
        value: sqlite:///data/running_coach.db
      - key: DB_PATH
        value: /app/data/running_coach.db
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GARMIN_EMAIL
        sync: false
      - key: GARMIN_PASSWORD
        sync: false
      - key: API_TOKEN
        sync: false
