name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check app tests

      - name: Run tests with coverage
        run: pytest --cov=app --cov-report=term-missing --cov-fail-under=80

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t ai-running-coach:ci .

      - name: Smoke-test the image
        run: |
          docker run -d --name coach -p 8000:8000 ai-running-coach:ci
          for i in $(seq 1 15); do
            if curl -sf http://localhost:8000/api/health; then
              echo "\n✅ health check passed"; ok=1; break
            fi
            sleep 2
          done
          docker logs coach
          docker rm -f coach
          test "${ok:-0}" = "1"
