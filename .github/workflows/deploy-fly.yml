name: Deploy to Fly.io

on:
  push:
    branches: [main, claude/running-analytics-platform-a017s4]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy to Fly.io
        # --detach skips post-deploy health-check polling, which false-fails
        # when auto_stop_machines="stop" shuts the machine down while flyctl waits.
        run: flyctl deploy --remote-only --detach
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
