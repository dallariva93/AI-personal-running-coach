name: Android APK

# Builds the debug APK of the Android app and publishes it as a downloadable
# artifact, so you can install it without Android Studio.
on:
  push:
    branches: [claude/running-analytics-platform-a017s4, main]
    paths: ["running-coach-platform/android/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["running-coach-platform/android/**", ".github/workflows/android.yml"]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: running-coach-platform/android
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install required SDK packages
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - name: Build debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: running-coach-debug-apk
          path: running-coach-platform/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
