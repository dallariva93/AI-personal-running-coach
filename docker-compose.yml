services:
  coach:
    build: .
    image: ai-running-coach:latest
    container_name: ai-running-coach
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Keep the database inside the mounted volume.
      DATABASE_URL: sqlite:///data/running_coach.db
    volumes:
      - ./data:/app/data
      - ./.garmin_tokens:/app/.garmin_tokens
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
